<!DOCTYPE HTML>
<html>
    <head>
	<style>
	 .header {
             display: flex;
	     background: linear-gradient(to right, black, red);
	     height: 50px;
	     width: 100%;
	     top: 0;
	     left: 0;
	     position: fixed;
             border-bottom : 2px solid black;
	 }
	 .generate-btn {
	     border: 2px solid white;
	     border-radius: 20px;
	     background-color: black;
	     color: white;
	     padding: 10px 20px;
	     position: absolute;
	     left: 20px;
	     top: 60px;
	     z-index: 100;
	 }
	 .content {
	     display: flex;
	     flex-wrap: wrap;
	     margin-top: 60px;
	     padding: 20px;
	 }
	 .prompt {
	     margin: 10px;
	     background-color: lightgray;
	     padding: 20px;
	     border-radius: 10px;
	     min-width: 200px;
	     text-align: center;
	     animation: fadeIn 2s;
	     box-shadow: 10px 10px 2px #ff99c2;
	 }
	 @keyframes fadeIn {
	     0% { opacity: 0; }
	     100% { opacity: 1; }
	 }
	 @-moz-keyframes fadeIn {
	     0% { opacity: 0; }
	     100% { opacity: 1; }
	 }
	</style>
    </head>
    <body>
	<div class="header"></div>
	<button class="generate-btn">Generate Image</button>
	<div class="content"></div>
	<script src="gen-gpt.js"></script>
    </body>
</html>
